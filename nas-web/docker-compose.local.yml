# Run CinaRip on this laptop without touching the NAS stack.
#   docker compose -f docker-compose.local.yml up --build
#
# Optional Videos folder:
#   CINARIP_VIDEOS=/path/to/videos docker compose -f docker-compose.local.yml up --build
#
# Tornado prefers IPv6. This Wi-Fi often has none, and IPv4 TLS is reset.
# TORNADO_IP=auto tries IPv6 then IPv4. Enable IPv6 or 1.1.1.1 / WARP for a live session.
services:
  cinarip-local:
    build:
      context: .
      dockerfile: Dockerfile.local
    image: cinarip-nas:local
    container_name: cinarip-local
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: "8787"
      VIDEO_ROOT: /data/videos
      DATA_ROOT: /data/app
      CURL_IMPERSONATE_BIN: /opt/curl-impersonate/curl-impersonate
      TORNADO_IP: "auto"
      APP_PIN: ${APP_PIN:-}
      CINARIP_PIN: ${CINARIP_PIN:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-30}
    volumes:
      - ${CINARIP_VIDEOS:-./videos}:/data/videos:rw
      - ./server.js:/app/server.js:ro
      - ./public:/app/public:ro
      - ./data:/data/app:rw

networks:
  default:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.28.10.0/24
        - subnet: fd00:c10a:1::/64
